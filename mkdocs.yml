site_name: From Reads to Outbreaks
site_description: Practical viral pathogen genomics using NGS data
site_url: https://damientully.github.io/reads-to-outbreaks/
repo_url: https://github.com/damientully/reads-to-outbreaks
repo_name: damientully/reads-to-outbreaks
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: teal
      toggle: { icon: material/weather-sunny, name: Light mode }
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Workshop: index.md
